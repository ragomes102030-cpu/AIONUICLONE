<?xml version="1.0" encoding="UTF-8"?>
<!-- Arquimedes - main app icon (full colour, blueprint background). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Arquimedes">
  <defs>
    <linearGradient id="arq-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1b2b4a" />
      <stop offset="1" stop-color="#080e1c" />
    </linearGradient>
    <linearGradient id="arq-steel" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#d7e2ef" />
      <stop offset="1" stop-color="#94a8c2" />
    </linearGradient>
    <linearGradient id="arq-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d" />
      <stop offset="1" stop-color="#f97316" />
    </linearGradient>
    <clipPath id="arq-clip">
      <rect width="512" height="512" rx="112" />
    </clipPath>
  </defs>
  <g clip-path="url(#arq-clip)">
    <rect width="512" height="512" fill="url(#arq-bg)" />
    <!-- blueprint grid -->
    <g stroke="#2b4a7d" stroke-width="2" opacity="0.4">
      <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512" />
      <path d="M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512" />
    </g>
    <!-- drafting compass (arco de compasso) -->
    <g stroke="url(#arq-steel)" stroke-width="22" stroke-linecap="round" fill="none">
      <path d="M256 104 L176 366" />
      <path d="M256 104 L336 366" />
    </g>
    <circle cx="256" cy="104" r="34" fill="url(#arq-accent)" />
    <circle cx="256" cy="104" r="13" fill="#0a1122" />
    <!-- extension lines + dimension line (linha de cota) -->
    <g stroke="#38bdf8" stroke-width="7" opacity="0.85">
      <path d="M176 372V420" />
      <path d="M336 372V420" />
    </g>
    <g stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M176 420H336" />
      <path d="M176 398V442" />
      <path d="M336 398V442" />
    </g>
  </g>
</svg>
